<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VR Cinema Player — SBS & Custom VR Box Calibration</title>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/vr.css">
    <link rel="stylesheet" href="css/controls.css">

    <!-- Three.js 3D Rendering Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- VR Viewport Container -->
    <div id="vr-viewport">
        <!-- 3D WebGL Stereo Canvas -->
        <canvas id="vr-canvas"></canvas>

        <!-- SVG Barrel Lens Vignette Mask Overlay -->
        <div id="barrel-overlay">
            <svg id="barrel-svg" width="100%" height="100%" preserveAspectRatio="none">
                <defs>
                    <mask id="lens-mask">
                        <rect width="100%" height="100%" fill="white"/>
                        <ellipse id="mask-left-eye" cx="25%" cy="50%" rx="22%" ry="42%" fill="black"/>
                        <ellipse id="mask-right-eye" cx="75%" cy="50%" rx="22%" ry="42%" fill="black"/>
                    </mask>
                </defs>
                <rect width="100%" height="100%" fill="#000000" mask="url(#lens-mask)"/>
            </svg>
        </div>

        <!-- Floating Menu Toggle Button (☰) -->
        <button id="menu-toggle-btn" title="Toggle Controls">☰</button>

        <!-- Glassmorphic Floating Control HUD -->
        <div id="control-hud">
            <div class="hud-header">
                <h2>🎬 VR Cinema</h2>
                <div class="mode-toggle">
                    <button id="mode-2d-btn" class="btn-mode active">2D</button>
                    <button id="mode-sbs-btn" class="btn-mode">SBS 3D</button>
                </div>
            </div>

            <!-- Media Sources -->
            <div class="hud-section">
                <div class="hud-section-title">Media Input</div>
                <div class="source-grid">
                    <label class="btn-input-file">
                        📂 Local Video
                        <input type="file" id="local-video-input" accept="video/mp4,video/mkv,video/webm,video/*">
                    </label>
                    <label class="btn-input-file">
                        🖼️ Local Image
                        <input type="file" id="local-image-input" accept="image/jpeg,image/png,image/webp,image/*">
                    </label>
                </div>
                <div class="youtube-box">
                    <input type="text" id="youtube-url-input" placeholder="Paste YouTube URL...">
                    <button id="youtube-load-btn" class="btn-action">Load</button>
                </div>
            </div>

            <!-- Playback Controls -->
            <div class="hud-section">
                <div class="hud-section-title">Playback</div>
                <div class="playback-bar">
                    <button id="play-pause-btn" class="btn-icon" title="Play / Pause">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                    </button>
                    <div class="timeline-container">
                        <input type="range" id="seek-slider" min="0" max="100" value="0" step="0.1">
                        <div class="time-display">
                            <span id="current-time">00:00</span>
                            <span id="duration-time">00:00</span>
                        </div>
                    </div>
                </div>
                <div style="display:flex; align-items:center; gap:10px; margin-top:12px;">
                    <span style="font-size:12px; color:var(--text-muted);">Volume</span>
                    <input type="range" id="volume-slider" min="0" max="100" value="100">
                    <button id="fullscreen-btn" class="btn-icon" title="Fullscreen" style="width:32px; height:32px;">⛶</button>
                </div>
            </div>

            <!-- Head Tracking Sensors -->
            <div class="hud-section">
                <div class="hud-section-title">Sensors & Head Tracking</div>
                <div style="display:flex; gap:8px;">
                    <button id="recenter-gyro-btn" class="btn-input-file" style="flex:1;">🔄 Recenter View</button>
                    <button id="enable-gyro-btn" class="btn-input-file" style="flex:1;">📱 Enable Gyro</button>
                </div>
            </div>

            <!-- VR Calibration -->
            <div class="hud-section" style="margin-bottom:0;">
                <button id="open-calibration-btn" class="btn-action" style="width:100%; padding:12px; background:rgba(0,240,255,0.15); color:var(--accent-blue); border:1px solid var(--accent-blue);">
                    ⚙️ VR Box Lens Calibration
                </button>
            </div>
        </div>
    </div>

    <!-- VR Box Lens & Viewport Calibration Modal -->
    <div id="calibration-modal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3>⚙️ VR Box Lens Calibration</h3>
                <button id="close-calibration-btn" class="close-btn">&times;</button>
            </div>

            <!-- Lens Masking -->
            <div class="hud-section-title">Eye Viewport & Mask Width</div>
            <div class="slider-group">
                <div class="slider-row">
                    <label for="cal-left-mask">Left Mask Width</label>
                    <input type="range" id="cal-left-mask" min="0.5" max="1.5" step="0.05" value="1.0">
                    <span id="cal-left-mask-val" class="val">1.0</span>
                </div>
                <div class="slider-row">
                    <label for="cal-right-mask">Right Mask Width</label>
                    <input type="range" id="cal-right-mask" min="0.5" max="1.5" step="0.05" value="1.0">
                    <span id="cal-right-mask-val" class="val">1.0</span>
                </div>
            </div>

            <!-- Viewport Alignment -->
            <div class="hud-section-title">Eye Separation & Alignment</div>
            <div class="slider-group">
                <div class="slider-row">
                    <label for="cal-left-x">Left X Offset (px)</label>
                    <input type="range" id="cal-left-x" min="-100" max="100" step="1" value="0">
                    <span id="cal-left-x-val" class="val">0</span>
                </div>
                <div class="slider-row">
                    <label for="cal-right-x">Right X Offset (px)</label>
                    <input type="range" id="cal-right-x" min="-100" max="100" step="1" value="0">
                    <span id="cal-right-x-val" class="val">0</span>
                </div>
                <div class="slider-row">
                    <label for="cal-y-offset">Vertical Y Offset (px)</label>
                    <input type="range" id="cal-y-offset" min="-100" max="100" step="1" value="0">
                    <span id="cal-y-offset-val" class="val">0</span>
                </div>
                <div class="slider-row">
                    <label for="cal-center-gap">Center Gap (px)</label>
                    <input type="range" id="cal-center-gap" min="0" max="150" step="2" value="0">
                    <span id="cal-center-gap-val" class="val">0</span>
                </div>
            </div>

            <!-- Screen Geometry (Zoom & Distance) -->
            <div class="hud-section-title">3D Cinema Screen Scale & Distance</div>
            <div class="slider-group">
                <div class="slider-row">
                    <label for="cal-screen-scale">Screen Scale (Zoom)</label>
                    <input type="range" id="cal-screen-scale" min="0.4" max="2.5" step="0.05" value="1.0">
                    <span id="cal-screen-scale-val" class="val">1.0</span>
                </div>
                <div class="slider-row">
                    <label for="cal-screen-distance">Screen Distance</label>
                    <input type="range" id="cal-screen-distance" min="1.5" max="12.0" step="0.2" value="4.0">
                    <span id="cal-screen-distance-val" class="val">4.0</span>
                </div>
                <div class="slider-row">
                    <label for="cal-screen-offset-x">Screen X Shift</label>
                    <input type="range" id="cal-screen-offset-x" min="-3.0" max="3.0" step="0.1" value="0">
                    <span id="cal-screen-offset-x-val" class="val">0</span>
                </div>
                <div class="slider-row">
                    <label for="cal-screen-offset-y">Screen Y Shift</label>
                    <input type="range" id="cal-screen-offset-y" min="-3.0" max="3.0" step="0.1" value="0">
                    <span id="cal-screen-offset-y-val" class="val">0</span>
                </div>
                <div class="slider-row">
                    <label for="cal-gyro-sensitivity">Gyro Sensitivity</label>
                    <input type="range" id="cal-gyro-sensitivity" min="0.2" max="2.5" step="0.1" value="1.0">
                    <span id="cal-gyro-sensitivity-val" class="val">1.0</span>
                </div>
            </div>

            <!-- Calibration Pattern -->
            <div class="slider-row" style="margin-bottom:12px;">
                <label for="cal-show-grid" style="width:auto;">🎯 Show Test Grid & Crosshairs</label>
                <input type="checkbox" id="cal-show-grid" style="width:20px; height:20px;">
            </div>

            <div class="modal-actions">
                <button id="reset-calibration-btn" class="btn-secondary">Reset Defaults</button>
                <button id="save-calibration-btn" class="btn-action">Save Profile</button>
            </div>
        </div>
    </div>

    <!-- Hidden HTML5 Video Element for Texture Source -->
    <video id="hidden-video-player" playsinline crossorigin="anonymous"></video>

    <!-- Application Module Scripts -->
    <script src="js/settings.js"></script>
    <script src="js/gyro.js"></script>
    <script src="js/local-media.js"></script>
    <script src="js/youtube.js"></script>
    <script src="js/player.js"></script>
    <script src="js/vr.js"></script>
    <script src="js/calibration.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
