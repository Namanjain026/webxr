<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VR Cinema - WebXR & Google Cardboard 3D Theater</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Glassmorphic HUD Stylesheet -->
    <link rel="stylesheet" href="css/style.css">

    <!-- A-Frame 1.6.0 WebXR & Cardboard Engine -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- HLS.js for Streaming & Advanced Video Format Decoding -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <!-- Custom Scripts -->
    <script src="js/textures.js"></script>
    <script src="js/stereo-shader.js"></script>
    <script src="js/vr-controls.js"></script>
    <script src="js/network-qr.js"></script>
    <script src="js/app.js"></script>
</head>
<body>

    <!-- Video Element (Source for Cinema Screen Texture & Audio) -->
    <video id="cinema-video" crossorigin="anonymous" playsinline webkit-playsinline loop muted style="display:none;"></video>

    <!-- A-Frame 3D Scene Container -->
    <a-scene id="cinema-scene" embedded vr-mode-ui="enabled: true" loading-screen="enabled: false" renderer="antialias: true; colorManagement: true;">
        
        <!-- Asset Management System -->
        <a-assets>
            <canvas id="demo-canvas-asset" width="1280" height="720"></canvas>
        </a-assets>

        <!-- Ambient & Directional Lighting Setup -->
        <a-light id="ambient-light" type="ambient" color="#1a1c23" intensity="0.4"></a-light>

        <!-- Ceiling Downward Spotlight aimed at Seating Rows -->
        <a-light type="spot" color="#ffffff" intensity="0.6" position="0 7 -2" target="#rig" angle="60" penumbra="0.5"></a-light>

        <!-- Dynamic Screen Bounce Light (Updated dynamically via video frame color sampling) -->
        <a-light id="screen-glow-light" type="point" color="#00f0ff" intensity="1.2" distance="18" position="0 3.2 -5"></a-light>

        <!-- Camera Rig & Player Controller -->
        <a-entity id="rig" position="0 1.6 0" vr-controller-manager>
            <a-camera id="vr-camera" look-controls="pointerLockEnabled: false" wasd-controls="enabled: false">
                <!-- Gaze / Fuse Countdown Cursor for Google Cardboard VR Mode -->
                <a-entity id="gaze-cursor" 
                          cursor="fuse: true; fuseTimeout: 1500" 
                          position="0 0 -1"
                          geometry="primitive: ring; radiusInner: 0.015; radiusOuter: 0.025; thetaLength: 360" 
                          material="color: #ffffff; shader: flat; opacity: 0.8" 
                          raycaster="objects: .raycastable" 
                          visible="false" 
                          fuse-feedback>
                </a-entity>
            </a-camera>

            <!-- WebXR 6DoF Laser Controllers for VR Headsets (Meta Quest / SteamVR) -->
            <a-entity laser-controls="hand: right" raycaster="objects: .raycastable; far: 20"></a-entity>
            <a-entity laser-controls="hand: left" raycaster="objects: .raycastable; far: 20"></a-entity>
        </a-entity>

        <!-- Curved Cinema Screen -->
        <a-entity id="screen-container" position="0 3.2 -8">
            <!-- Curved Video Mesh -->
            <a-curvedvideo id="cinema-screen" 
                            class="raycastable"
                            src="#cinema-video" 
                            radius="10" 
                            theta-length="100" 
                            height="5.8" 
                            rotation="0 130 0" 
                            scale="1 1 1"
                            stereo-video="mode: mono">
            </a-curvedvideo>
            
            <!-- Curved Screen Outer Frame Bezel -->
            <a-curvedvideo id="screen-bezel" 
                            radius="10.05" 
                            theta-length="102" 
                            height="6.0" 
                            rotation="0 129 0" 
                            material="color: #08090c; roughness: 0.8; metalness: 0.2">
            </a-curvedvideo>
        </a-entity>

        <!-- ================= THEATER THEME 1: GRAND VELVET AUDITORIUM ================= -->
        <a-entity id="env-grand-velvet" visible="true">
            <!-- Auditorium Floor -->
            <a-plane position="0 0 -2" rotation="-90 0 0" width="24" height="24" material="color: #12141d; roughness: 0.6"></a-plane>
            
            <!-- Ceiling with Acoustic Wood Slats -->
            <a-plane position="0 8 -2" rotation="90 0 0" width="24" height="24" material="color: #1a0f0a; roughness: 0.9"></a-plane>
            
            <!-- Side Walls with Warm Sconces -->
            <a-plane position="-12 4 -2" rotation="0 90 0" width="24" height="10" material="color: #2b170c; roughness: 0.8"></a-plane>
            <a-plane position="12 4 -2" rotation="0 -90 0" width="24" height="10" material="color: #2b170c; roughness: 0.8"></a-plane>

            <!-- Wall Sconce Lights -->
            <a-light type="point" color="#ffb703" intensity="0.5" distance="6" position="-11.8 3.5 -2"></a-light>
            <a-light type="point" color="#ffb703" intensity="0.5" distance="6" position="11.8 3.5 -2"></a-light>

            <!-- Seating Rows (Red Velvet Plush Seats) -->
            <!-- Center Sweet Spot Seat Row -->
            <a-entity id="seat-center-row" position="0 0.5 0">
                <a-box position="-1.2 0 0" width="0.8" height="0.9" depth="0.8" material="color: #800c24; roughness: 0.7"></a-box>
                <a-box position="0 0 0" width="0.8" height="0.9" depth="0.8" material="color: #a00c24; roughness: 0.7"></a-box>
                <a-box position="1.2 0 0" width="0.8" height="0.9" depth="0.8" material="color: #800c24; roughness: 0.7"></a-box>
            </a-entity>

            <!-- Front Row Seats -->
            <a-entity id="seat-front-row" position="0 0.2 -3.8">
                <a-box position="-1.5 0 0" width="0.8" height="0.8" depth="0.8" material="color: #600a1c"></a-box>
                <a-box position="0 0 0" width="0.8" height="0.8" depth="0.8" material="color: #600a1c"></a-box>
                <a-box position="1.5 0 0" width="0.8" height="0.8" depth="0.8" material="color: #600a1c"></a-box>
            </a-entity>

            <!-- Balcony Back Row Seats -->
            <a-entity id="seat-balcony-row" position="0 2.4 5.5">
                <a-box position="-1.2 0 0" width="0.8" height="0.9" depth="0.8" material="color: #600a1c"></a-box>
                <a-box position="0 0 0" width="0.8" height="0.9" depth="0.8" material="color: #600a1c"></a-box>
                <a-box position="1.2 0 0" width="0.8" height="0.9" depth="0.8" material="color: #600a1c"></a-box>
            </a-entity>
        </a-entity>

        <!-- ================= THEATER THEME 2: CYBERPUNK VR LOUNGE ================= -->
        <a-entity id="env-cyberpunk" visible="false">
            <!-- Neon Grid Floor -->
            <a-plane position="0 0 -2" rotation="-90 0 0" width="24" height="24" material="color: #050814; roughness: 0.2; metalness: 0.8"></a-plane>

            <!-- Cyberpunk Neon Wall Strips -->
            <a-box position="-11.9 4 -2" width="0.2" height="0.2" depth="24" material="color: #00f0ff; shader: flat; emissive: #00f0ff"></a-box>
            <a-box position="11.9 4 -2" width="0.2" height="0.2" depth="24" material="color: #ff2a5f; shader: flat; emissive: #ff2a5f"></a-box>
        </a-entity>

        <!-- ================= THEATER THEME 3: COZY HOME THEATER ================= -->
        <a-entity id="env-cozy-home" visible="false">
            <!-- Wood Parquet Floor -->
            <a-plane position="0 0 -2" rotation="-90 0 0" width="16" height="16" material="color: #2b170c; roughness: 0.5"></a-plane>

            <!-- Soft Carpet Rug under couch -->
            <a-plane position="0 0.01 0" rotation="-90 0 0" width="6" height="4" material="color: #d8c3a5; roughness: 0.9"></a-plane>

            <!-- Warm Couch Sofa -->
            <a-box position="0 0.4 0" width="2.4" height="0.6" depth="1.0" material="color: #4a4e69"></a-box>
        </a-entity>

        <!-- ================= FLOATING 3D IN-VR DASHBOARD MENU ================= -->
        <a-entity id="vr-floating-menu" position="0 1.3 -2.2" rotation="0 0 0" visible="true">
            <!-- Glass Backing Panel -->
            <a-plane width="2.2" height="1.0" material="color: #0d0e15; opacity: 0.88; transparent: true; roughness: 0.2" radius="0.08"></a-plane>

            <!-- Menu Header Title -->
            <a-text value="VR CINEMA CONTROL" position="0 0.38 0.02" align="center" width="2.4" color="#00f0ff"></a-text>

            <!-- 3D Interactive Buttons (.raycastable for Laser & Gaze Cursor) -->
            <!-- Play / Pause Button -->
            <a-plane id="vr-play-btn" class="raycastable" position="-0.7 0.1 0.02" width="0.5" height="0.22" material="color: #ff2a5f; radius: 0.04">
                <a-text id="vr-play-text" value="PLAY / PAUSE" align="center" width="2.0" color="#ffffff"></a-text>
            </a-plane>

            <!-- Seek -10s -->
            <a-plane id="vr-seek-back-btn" class="raycastable" position="-0.1 0.1 0.02" width="0.45" height="0.22" material="color: #2a2d3d; radius: 0.04">
                <a-text value="-10s" align="center" width="2.2" color="#ffffff"></a-text>
            </a-plane>

            <!-- Seek +10s -->
            <a-plane id="vr-seek-fwd-btn" class="raycastable" position="0.45 0.1 0.02" width="0.45" height="0.22" material="color: #2a2d3d; radius: 0.04">
                <a-text value="+10s" align="center" width="2.2" color="#ffffff"></a-text>
            </a-plane>

            <!-- Theme Switcher Button -->
            <a-plane id="vr-theme-btn" class="raycastable" position="-0.6 -0.2 0.02" width="0.6" height="0.22" material="color: #2a2d3d; radius: 0.04">
                <a-text value="THEME CYCLE" align="center" width="1.8" color="#ffb703"></a-text>
            </a-plane>

            <!-- 3D Stereo Mode Button -->
            <a-plane id="vr-stereo-btn" class="raycastable" position="0.1 -0.2 0.02" width="0.6" height="0.22" material="color: #2a2d3d; radius: 0.04">
                <a-text value="3D STEREO" align="center" width="1.8" color="#00f0ff"></a-text>
            </a-plane>

            <!-- Toggle VR Menu Button -->
            <a-plane id="vr-close-menu-btn" class="raycastable" position="0.8 -0.2 0.02" width="0.35" height="0.22" material="color: #d90429; radius: 0.04">
                <a-text value="HIDE" align="center" width="1.8" color="#ffffff"></a-text>
            </a-plane>
        </a-entity>

    </a-scene>

    <!-- ================= 2D DESKTOP GLASSMORPHIC HUD ================= -->
    <div id="desktop-hud">
        
        <!-- Header Bar -->
        <header class="hud-header hud-interactive">
            <div class="brand">
                <span class="brand-icon">🎬</span>
                <h1>VR CINEMA 3D</h1>
            </div>

            <div class="header-actions">
                <!-- Seat Selector Buttons -->
                <button class="btn-secondary btn-seat" data-seat="front">Front Row</button>
                <button class="btn-secondary btn-seat" data-seat="center">Center Seat</button>
                <button class="btn-secondary btn-seat" data-seat="balcony">Balcony</button>

                <!-- Mobile QR Code Pair Modal Trigger -->
                <button id="btn-qr-modal" class="btn-secondary" title="Connect Google Cardboard Smartphone">
                    📱 Cardboard QR
                </button>

                <!-- Enter VR Native Button -->
                <button id="btn-enter-vr" class="btn-primary" onclick="document.querySelector('a-scene').enterVR()">
                    🥽 ENTER VR
                </button>
            </div>
        </header>

        <!-- Bottom Player Controls Bar -->
        <footer class="hud-footer hud-interactive">
            <!-- Progress / Time Scrub Bar -->
            <div class="scrub-container">
                <span id="time-current" class="time-stamp">0:00</span>
                <input type="range" id="scrub-bar" class="scrub-bar" value="0" min="0" max="100" step="0.1">
                <span id="time-duration" class="time-stamp">0:00</span>
            </div>

            <!-- Controls Row -->
            <div class="controls-row">
                <div class="left-controls">
                    <!-- Play / Pause -->
                    <button id="btn-play" class="btn-primary">⏸ Pause</button>

                    <!-- Volume Control -->
                    <div class="volume-group">
                        <span>🔊</span>
                        <input type="range" id="volume-slider" class="volume-slider" value="100" min="0" max="100">
                    </div>
                </div>

                <div class="right-controls">
                    <!-- File Picker Input (Supports MP4, MKV, AVI, MOV, WEBM, M4V, TS, FLV, OGV, WMV, M3U8) -->
                    <label class="btn-secondary" style="cursor: pointer;" title="Supports MP4, MKV, AVI, MOV, WEBM, M4V, TS, FLV, M3U8">
                        📂 Open Video File
                        <input type="file" id="video-file-input" accept="video/*, .mp4, .mkv, .avi, .mov, .webm, .m4v, .3gp, .ts, .flv, .ogv, .wmv, .m3u8, .mpd" style="display: none;">
                    </label>

                    <!-- Stream / Video URL Input Modal Button -->
                    <button id="btn-url-stream" class="btn-secondary" title="Play Video URL or HLS Stream">
                        🔗 Stream URL
                    </button>

                    <!-- Screen Size Select -->
                    <select id="select-screen-size" class="control-select">
                        <option value="standard">Standard 16:9</option>
                        <option value="imax" selected>IMAX Curved</option>
                        <option value="ultrawide">Ultra-Wide 21:9</option>
                    </select>

                    <!-- Theater Theme Select -->
                    <select id="select-theme" class="control-select">
                        <option value="grand-velvet" selected>Grand Velvet Auditorium</option>
                        <option value="cyberpunk">Cyberpunk VR Lounge</option>
                        <option value="cozy-home">Cozy Home Theater</option>
                    </select>

                    <!-- 3D Stereo Mode Select -->
                    <select id="select-stereo-mode" class="control-select">
                        <option value="mono" selected>2D Standard Flat</option>
                        <option value="sbs">3D Side-by-Side (SBS)</option>
                        <option value="ou">3D Over-Under (OU)</option>
                    </select>
                </div>
            </div>
        </footer>

    </div>

</body>
</html>
