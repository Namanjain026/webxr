<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SBS VR Cinema Player</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Three.js Engine for Fast Native Stereo SBS Rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- HLS.js for Adaptive Streams -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <!-- App Logic -->
    <script src="js/app.js"></script>
</head>
<body>

    <!-- Native Video Element (Source for Stereo WebGL Texture) -->
    <video id="cinema-video" crossorigin="anonymous" playsinline webkit-playsinline preload="auto" loop style="display:none;"></video>

    <!-- Fullscreen WebGL Canvas for Stereo SBS Rendering -->
    <canvas id="webgl-canvas"></canvas>

    <!-- Dark Barrel Vignette Overlay Frame (Matches Screenshot 1:1) -->
    <div id="barrel-overlay">
        <div class="barrel-window left-window"></div>
        <div class="barrel-window right-window"></div>
    </div>

    <!-- Top-Right Menu Icon Button (Matches Screenshot 1:1) -->
    <button id="menu-toggle-btn" class="menu-btn-icon" title="Toggle Controls Menu">
        <span>☰</span>
    </button>

    <!-- Floating Control Panel Overlay (Toggled via Menu Icon) -->
    <div id="control-panel" class="control-panel hidden">
        <div class="panel-header">
            <h2>🎬 VR Cinema Controls</h2>
            <button id="close-panel-btn" class="close-btn">✕</button>
        </div>

        <div class="panel-body">
            <!-- File & Stream Inputs -->
            <div class="input-section">
                <label class="btn-primary file-label">
                    📂 Select Video File
                    <input type="file" id="video-file-input" accept="video/*, .mp4, .mkv, .avi, .mov, .webm, .m4v, .3gp, .ts, .flv, .ogv, .wmv, .m3u8" style="display:none;">
                </label>
                <button id="btn-stream-url" class="btn-secondary">🔗 Stream URL</button>
            </div>

            <!-- Time Scrub Bar -->
            <div class="scrub-section">
                <span id="time-current" class="time-stamp">0:00</span>
                <input type="range" id="scrub-bar" class="scrub-bar" value="0" min="0" max="100" step="0.1">
                <span id="time-duration" class="time-stamp">0:00</span>
            </div>

            <!-- Playback Controls -->
            <div class="controls-grid">
                <button id="btn-play" class="btn-action">▶ Play</button>
                <button id="btn-recenter" class="btn-action">🔄 Recenter View</button>
                <button id="btn-gyro-perm" class="btn-action">📱 Enable Gyro Head Track</button>
            </div>

            <!-- Volume & Settings -->
            <div class="settings-row">
                <div class="volume-box">
                    <span>🔊 Volume</span>
                    <input type="range" id="volume-slider" class="volume-slider" value="100" min="0" max="100">
                </div>
                <div class="mode-box">
                    <span>Format:</span>
                    <select id="select-video-format" class="select-input">
                        <option value="2d" selected>Standard 2D Video</option>
                        <option value="sbs_3d">3D Side-by-Side Video</option>
                        <option value="ou_3d">3D Over-Under Video</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
